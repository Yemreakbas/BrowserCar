services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: browsercar-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - CORS_ORIGIN=*
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
